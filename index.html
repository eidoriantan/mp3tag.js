<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="mp3tag.js is an open-source JavaScript library used to edit the metadata of audio files.">
  <meta name="keywords" content="mp3, id3, audio, tag, edit, write">
  <meta name="author" content="Adriane Justine Tan">
  <meta name="google-site-verification" content="pygHTY6j2sle4JJ1YmSCYlf8nxIxnq4u9bHe48Mc9do">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c110f" media="(prefers-color-scheme: dark)">
  <meta name="msapplication-TileColor" content="#1f7a5c">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="mp3tag.js">
  <meta property="og:title" content="mp3tag.js">
  <meta property="og:description" content="MP3 tagging library written in pure JavaScript">
  <meta property="og:url" content="https://mp3tag.js.org/">
  <meta property="og:image" content="https://mp3tag.js.org/images/logo.png">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="https://mp3tag.js.org/">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1f7a5c">

  <script>
    // Restores the path GitHub Pages' 404.html redirected to `/?/path`
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?')
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
      }
    }(window.location));

    // Applies the theme before the first paint to avoid a flash
    (function () {
      var theme = null
      try { theme = localStorage.getItem('theme') } catch (e) {}
      var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)
    }());
  </script>

  <title>mp3tag.js</title>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <p style="padding:2rem;text-align:center">mp3tag.js needs JavaScript enabled to display this website.</p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
